services:
  api:
    build: .
    environment:
      AI_API_BASE_URL: ${AI_API_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TRANSCRIPTION_MODEL: ${AI_TRANSCRIPTION_MODEL:-}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      SARVAM_TRANSCRIPTION_MODEL: ${SARVAM_TRANSCRIPTION_MODEL:-saarika:v2.5}
    ports:
      - "8000:8000"

  app:
    build: .
    command: streamlit run streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    environment:
      LEGAL_HELP_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
